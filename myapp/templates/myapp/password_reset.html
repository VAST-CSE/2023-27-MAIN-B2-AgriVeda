{% extends 'myapp/base.html' %}

{% block title %}Reset Password - AgriVeda{% endblock %}

{% block extra_css %}
<style>
    .form-container {
        margin-top: 5rem;
        max-width: 500px;
    }
    
    .btn-submit {
        width: 100%;
        margin-top: 1.5rem;
        padding: 1.2rem;
        font-size: 1.15rem;
        border-radius: 12px;
    }

    .back-link {
        color: var(--primary-light);
        text-decoration: none;
        font-weight: 600;
        transition: var(--transition);
        font-size: 1.05rem;
    }
    
    .back-link:hover {
        color: var(--text-main);
        text-decoration: underline;
        text-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
    }
    
    .text-danger {
        color: var(--error, #ef4444);
    }
    
    .text-success {
        color: var(--primary-light, #10b981);
    }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Reset Password</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" class="form-control" required placeholder="Enter your username">
        </div>
        <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" name="new_password" id="new_password" class="form-control" required placeholder="Enter a new password">
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm New Password</label>
            <input type="password" name="confirm_password" id="confirm_password" class="form-control" required placeholder="Confirm your new password">
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="errorlist {% if message.tags == 'error' %}text-danger{% else %}text-success{% endif %}" style="text-align: center; margin-bottom: 1rem;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        <button type="submit" class="btn btn-primary btn-submit">Reset Password Now</button>
    </form>
    
    <div style="text-align: center; margin-top: 2rem;">
        <a href="{% url 'login' %}" class="back-link">Back to Login</a>
    </div>
</div>
{% endblock %}
